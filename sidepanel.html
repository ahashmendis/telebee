<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Telebee</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body data-view="join">
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true"></span>Telebee</div>
      <div class="topbar-right">
        <span id="conn" class="pill" data-state="idle"><i></i><span id="status">Not connected</span></span>
        <button id="settingsToggle" class="icon-btn" type="button" aria-label="Settings" aria-expanded="false" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <section id="settingsPanel" class="settings" hidden>
      <label>Microphone
        <select id="micSelect"><option value="">Default microphone</option></select>
      </label>
      <label>Camera
        <select id="cameraSelect"><option value="">Default camera</option></select>
      </label>
      <label>Server URL
        <input id="serverUrl" placeholder="wss://your-server.example" autocomplete="off" spellcheck="false">
      </label>
    </section>

    <main>
      <section id="joinView" class="view join">
        <div class="card">
          <h1>Watch together</h1>
          <p class="lead">Share a room code with a friend. Telebee opens the same video for both of you, keeps it in sync, and starts a call.</p>
          <label>Your name
            <input id="displayName" maxlength="24" placeholder="What should we call you?" autocomplete="off">
          </label>
          <label>Room code
            <span class="row">
              <input id="roomCode" maxlength="12" placeholder="ABC123" autocomplete="off" spellcheck="false">
              <button id="genBtn" class="btn ghost" type="button">New</button>
            </span>
          </label>
          <button id="joinBtn" class="btn primary" type="button">Join room</button>
          <p id="joinError" class="error" role="alert" hidden></p>
        </div>
      </section>

      <section id="roomView" class="view room" hidden>
        <div class="roombar">
          <span class="code" id="roomLabel"></span>
          <button id="copyBtn" class="chip" type="button">Copy code</button>
          <span id="roleBadge" class="chip role" hidden></span>
        </div>

        <div class="stage" id="stage">
          <video id="remoteVideo" autoplay playsinline></video>
          <div id="remoteEmpty" class="placeholder">
            <div id="remoteAvatar" class="avatar">?</div>
            <p id="remoteText">Waiting for someone to join…</p>
          </div>
          <span id="remoteName" class="nametag" hidden></span>
          <span id="remoteMuted" class="badge" hidden>Muted</span>
          <div class="self" id="self">
            <video id="localVideo" autoplay playsinline muted></video>
            <div id="selfOff" class="selfoff">You</div>
          </div>
        </div>

        <div class="controls">
          <button id="micBtn" class="ctl" type="button" aria-pressed="false" aria-label="Microphone" title="Microphone">
            <svg class="on" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18M9 9v2a3 3 0 0 0 5 2.2M15 9.3V6a3 3 0 0 0-5.6-1.5M5 11a7 7 0 0 0 11.2 5.6M19 11a7 7 0 0 1-.6 2.8M12 18v3"/></svg>
          </button>
          <button id="cameraBtn" class="ctl" type="button" aria-pressed="false" aria-label="Camera" title="Camera">
            <svg class="on" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>
            <svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18M16 11V8a2 2 0 0 0-2-2H8M5 6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-1M16 10l5-3v10"/></svg>
          </button>
          <button id="syncBtn" class="ctl" type="button" aria-label="Sync everyone to my video" title="Sync everyone to my video">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8M18 2v4h-4M6 22v-4h4"/></svg>
          </button>
          <button id="chatToggle" class="ctl" type="button" aria-pressed="true" aria-label="Chat" title="Show or hide chat">
            <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
            <span id="unread" class="count" hidden>0</span>
          </button>
          <button id="leaveBtn" class="ctl danger" type="button" aria-label="Leave room" title="Leave room">
            <svg viewBox="0 0 24 24"><path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 17l-5-5 5-5M5 12h12"/></svg>
          </button>
        </div>

        <div class="syncline"><span class="dot" aria-hidden="true"></span><span id="syncText">No video detected</span></div>

        <section id="chat" class="chat">
          <div id="messages" aria-live="polite"></div>
          <form id="chatForm" autocomplete="off">
            <input id="chatInput" placeholder="Message…" maxlength="2000" autocomplete="off">
            <button class="btn primary" type="submit">Send</button>
          </form>
        </section>
      </section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
