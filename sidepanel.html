<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header>
      <div class="brand">Telebee</div>
      <div class="mediaControls">
        <button id="micBtn" type="button" aria-pressed="false" title="Allow microphone access and mute or unmute">Mic: off</button>
        <button id="cameraBtn" type="button" aria-pressed="false" title="Allow camera access and turn it on or off">Camera: off</button>
        <button id="chatToggle" type="button" aria-pressed="true" title="Hide chat and system messages">Chat: on</button>
      </div>
    </header>

    <section class="devices">
      <label>Microphone
        <select id="micSelect"><option value="">Default microphone</option></select>
      </label>
      <label>Camera
        <select id="cameraSelect"><option value="">Default camera</option></select>
      </label>
    </section>

    <section class="room">
      <input id="roomCode" maxlength="12" placeholder="ROOM CODE" autocomplete="off">
      <button id="joinBtn">Join</button>
    </section>

    <section class="server">
      <input id="serverUrl" placeholder="wss://your-server.example">
    </section>

    <div id="status" class="status">Not connected</div>

    <section id="videos" class="videos"></section>

    <section class="sync">
      <button id="syncBtn">Sync to me</button>
      <span id="syncText">No video detected</span>
    </section>

    <section class="chat">
      <div id="messages"></div>
      <form id="chatForm">
        <input id="chatInput" placeholder="Message..." autocomplete="off">
        <button>Send</button>
      </form>
    </section>

    <script src="sidepanel.js"></script>
  </body>
</html>
